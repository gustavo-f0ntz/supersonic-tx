[package]
name = "supersonic-tx"
version = "0.1.0"
description = "On-chain atomic, non-custodial router for intent-ambiguous transfer bundles (Solana)."
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "supersonic_tx"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
