[package]
name = "supersonic-cli"
version = "0.1.0"
description = "supersonic — plan/warm/recover/inspect channel-complete intent-ambiguous bundles."
edition = "2021"
license = "MIT"

[[bin]]
name = "supersonic"
path = "src/main.rs"

[[bin]]
name = "program-identity"
path = "src/bin/program_identity.rs"

[dependencies]
supersonic-sdk = { path = "../supersonic-sdk" }
solana-sdk = { workspace = true }
solana-client = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
solana-transaction-status-client-types = "2.2"
