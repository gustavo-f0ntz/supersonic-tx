name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --component rustfmt --component clippy --profile minimal

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            bench/pinocchio-router/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      # The tree is warning-free, so a warning is a regression, not background noise.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install Solana toolchain (for cargo build-sbf)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build the program .so
        run: cargo build-sbf --manifest-path programs/supersonic-tx/Cargo.toml

      # bench/pinocchio-router is a detached workspace (no_std, BPF-only — see its own
      # Cargo.toml), so it's outside `cargo fmt/clippy --workspace` above and needs its
      # own checks + build.
      - name: Format + clippy the Pinocchio benchmark crate
        run: |
          cargo fmt --manifest-path bench/pinocchio-router/Cargo.toml --all -- --check
          cargo clippy --manifest-path bench/pinocchio-router/Cargo.toml --all-targets -- -D warnings

      - name: Build the Pinocchio benchmark program .so
        run: cargo build-sbf --manifest-path bench/pinocchio-router/Cargo.toml

      - name: Test (all crates, incl. the LiteSVM/Mollusk e2e that load the .so files)
        run: cargo test --workspace
