[package]
name = "supersonic-tx-pinocchio"
version = "0.1.0"
edition = "2021"
description = "Pinocchio reimplementation of the supersonic-tx router core, for the Anchor-vs-Pinocchio benchmark (see BENCHMARK.md)."
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = "0.11.2"
pinocchio-system = "0.6.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Detached from the parent Cargo workspace: this is a no_std BPF-only crate and must
# not be built for the host target by the workspace test/build.
[workspace]

# pinocchio's `entrypoint!`/`nostd_panic_handler!` macros emit a `cfg(target_os =
# "solana")` check for the real BPF target — clippy running against the host target
# doesn't know that value exists and flags macro-generated code we don't control.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']
