[package]
name = "composability-demo"
version = "0.1.0"
description = "An independent binary that casts through supersonic-tx using only the published supersonic-sdk API — the composability proof in COMPOSABILITY.md."
edition = "2021"
license = "MIT"

[[bin]]
name = "composability-demo"
path = "src/main.rs"

[dependencies]
# A real external integrator would pin a git rev/tag of supersonic-tx instead of a path;
# this repo uses a path only because the crate under test lives right here.
supersonic-sdk = { path = "../supersonic-sdk" }
solana-sdk = { workspace = true }
solana-client = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
